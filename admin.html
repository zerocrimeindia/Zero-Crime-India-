<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZCI - एडमिन कंसोल</title>
    <style>
        :root {
            --bg: #0b1120;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #10b981;
            --border: #334155;
            --danger: #ef4444;
            --accent: #38bdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px 12px; display: flex; justify-content: center; }
        .container { max-width: 850px; width: 100%; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
        h1 { font-size: 1.3rem; color: var(--primary); }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        input[type="password"], select {
            width: 100%; padding: 11px; background: #070d18; border: 1px solid var(--border);
            border-radius: 6px; color: var(--text); font-size: 1rem; outline: none; margin-bottom: 12px;
        }
        button {
            width: 100%; padding: 11px; background: var(--primary); color: #070d18;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem;
        }
        .report-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; background: rgba(56, 189, 248, 0.15); color: var(--accent); }
        .token { font-family: monospace; font-size: 0.8rem; color: var(--muted); margin-left: 6px; }
        .details-box { background: #070d18; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin: 10px 0; white-space: pre-wrap; font-size: 0.95rem; color: #e2e8f0; line-height: 1.4; }
        .actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; font-size: 0.85rem; }
        .status-select { width: auto; margin-bottom: 0; padding: 6px 10px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 Zero Crime India - एडमिन पैनल</h1>
            <span style="font-size: 0.8rem; color: var(--muted);">क्विक एक्सेस</span>
        </header>

        <!-- आसान सीक्रेट पिन बॉक्स -->
        <div id="authSection" class="card" style="max-width: 420px; margin: 40px auto;">
            <h2 style="font-size: 1.1rem; margin-bottom: 8px; color: var(--text);">एडमिन सीक्रेट पिन</h2>
            <p style="font-size: 0.82rem; color: var(--muted); margin-bottom: 14px;">पोर्टल खोलने के लिए अपना 4-अंकों का पिन दर्ज करें:</p>
            <input type="password" id="adminPin" placeholder="सीक्रेट पिन दर्ज करें (उदा. 9876)" maxlength="12">
            <button onclick="unlockPortal()">पैनल खोलें</button>
            <div id="authError" style="color: var(--danger); font-size: 0.85rem; margin-top: 10px; display: none;">गलत पिन! कृपया पुनः प्रयास करें।</div>
        </div>

        <!-- रिपोर्ट्स की लिस्ट -->
        <div id="dashboardSection" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="font-size: 1.1rem; color: var(--text);">दर्ज रिपोर्ट्स (<span id="reportCount">0</span>)</h2>
                <button onclick="loadReports()" style="width: auto; padding: 6px 14px; font-size: 0.85rem;">🔄 रिफ्रेश</button>
            </div>
            <div id="loadingText" style="color: var(--muted); font-size: 0.9rem; display: none;">रिपोर्ट्स लोड हो रही हैं...</div>
            <div id="reportsList"></div>
        </div>
    </div>

    <script>
        // आपका सरल मास्टर पिन (आप इसे 1234, 7860, 9999 कुछ भी बदल सकते हैं)
        const ADMIN_PIN = "7860"; 

        const SUPABASE_URL = "https://styviwkbbctiutdyfpnh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_qo6tcPg6dJdcPyhZFMMWFw_OpBP0xHL";

        function unlockPortal() {
            const entered = document.getElementById('adminPin').value.trim();
            const err = document.getElementById('authError');
            if (entered === ADMIN_PIN) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                loadReports();
            } else {
                err.style.display = 'block';
            }
        }

        function base64ToUint8(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        async function decryptPayload(payloadStr) {
            try {
                const data = JSON.parse(payloadStr);
                const rawKey = base64ToUint8(data.key);
                const iv = base64ToUint8(data.iv);
                const ciphertext = base64ToUint8(data.ciphertext);
                const key = await crypto.subtle.importKey("raw", rawKey, { name: "AES-GCM" }, false, ["decrypt"]);
                const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ciphertext);
                return new TextDecoder().decode(decrypted);
            } catch (e) {
                return "[डेटा सुरक्षित / डिक्रिप्शन लंबित]";
            }
        }

        async function loadReports() {
            const loading = document.getElementById('loadingText');
            const list = document.getElementById('reportsList');
            loading.style.display = 'block';
            list.innerHTML = '';

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/reports?select=*&order=created_at.desc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const reports = await res.json();
                document.getElementById('reportCount').textContent = reports.length;
                loading.style.display = 'none';

                for (const report of reports) {
                    const text = await decryptPayload(report.encrypted_details);
                    const date = new Date(report.created_at).toLocaleString('hi-IN');

                    const item = document.createElement('div');
                    item.className = 'report-card';
                    item.innerHTML = `
                        <div class="report-header">
                            <div>
                                <span class="badge">${report.category || 'सामान्य'}</span>
                                <span class="token">${report.token_id}</span>
                            </div>
                            <span style="font-size: 0.8rem; color: var(--muted);">${date}</span>
                        </div>
                        <div class="details-box">${text}</div>
                        <div class="actions">
                            <div>
                                <label style="margin-right: 6px;">स्थिति:</label>
                                <select class="status-select" onchange="updateStatus('${report.token_id}', this.value)">
                                    <option value="लंबित (Pending)" ${report.status === 'लंबित (Pending)' ? 'selected' : ''}>लंबित (Pending)</option>
                                    <option value="समीक्षाधीन (Under Review)" ${report.status === 'समीक्षाधीन (Under Review)' ? 'selected' : ''}>समीक्षाधीन (Under Review)</option>
                                    <option value="कार्रवाई जारी (In Progress)" ${report.status === 'कार्रवाई जारी (In Progress)' ? 'selected' : ''}>कार्रवाई जारी (In Progress)</option>
                                    <option value="निस्तारित (Resolved)" ${report.status === 'निस्तारित (Resolved)' ? 'selected' : ''}>निस्तारित (Resolved)</option>
                                </select>
                            </div>
                            <span id="stat-msg-${report.token_id}" style="color: var(--primary); font-size: 0.8rem;"></span>
                        </div>
                    `;
                    list.appendChild(item);
                }
            } catch (err) {
                loading.textContent = "डेटा लोड करने में समस्या आई।";
            }
        }

        async function updateStatus(tokenId, newStatus) {
            const msg = document.getElementById(`stat-msg-${tokenId}`);
            msg.textContent = "अपडेट...";
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/reports?token_id=eq.${encodeURIComponent(tokenId)}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ status: newStatus, updated_at: new Date().toISOString() })
                });
                if (res.ok) {
                    msg.textContent = "✓ सेव";
                    setTimeout(() => msg.textContent = '', 2000);
                }
            } catch (e) {
                msg.textContent = "त्रुटि";
            }
        }
    </script>
</body>
</html>
